name: Docker image + end-to-end tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: |
          find . -name '*.php' -not -path './Admin/email/vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Build image
        run: docker build -t job-hunt .
      - name: Start container
        run: |
          docker run -d --name jobhunt -e PORT=8080 -p 8080:8080 job-hunt
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/index.php > /dev/null && break; sleep 2; done
          docker logs jobhunt | tail -5
      - name: Database reachable from the test runner
        run: docker exec -i jobhunt mariadb -uroot job_portal -N -e "SELECT COUNT(*) FROM all_jobs"
      - name: End-to-end tests (44 checks)
        env:
          B: http://127.0.0.1:8080
          MYSQL: docker exec -i jobhunt mariadb
          DB_HOST: localhost
          DB_USER: root
        run: bash tests/e2e.sh
      - name: Container logs on failure
        if: failure()
        run: docker logs jobhunt | tail -60

  # Starts the portal exactly the way the "Open in Codespaces" button does, and checks it answers.
  codespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            docker build -t job-hunt . && docker run -d --name jobhunt -e PORT=8080 -p 8080:8080 job-hunt
            for i in $(seq 1 60); do curl -sf http://localhost:8080/index.php > /dev/null && break; sleep 3; done
            curl -sf http://localhost:8080/index.php | grep -qi "job"
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/Admin/admin_login.php)" = 200
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/job_portal.sql)" = 403
            echo "Codespace start-up check passed"
